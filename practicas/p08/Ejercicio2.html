<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title> Ejercicio 2 - Combinacion de columnas</title>

        <style type="text/css">
            td, th { border: 1px solid #CCC; }
            table {border: 1px solid black; }
        </style>

    </head>

    <body>

        <table>
            <tr>
                <th>7:00 pm</th>
                <th>7:30 pm</th>
                <th>8:00 pm</th>
            </tr>
            <tr>
                <td colspan="3">The Sunday Night Movie</td>
            </tr>
            <tr>
                <td>Perry Mason</td>
                <td>Candid Camera</td>
                <td>What's My Line</td>
            </tr>
            <tr>
                <td>Bonanza</td>
                <td colspan="2">The Wackiest Ship in the Army</td>
            </tr>
        </table>

    </body>
</html>
